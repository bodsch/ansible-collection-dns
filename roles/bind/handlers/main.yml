---

- name: systemctl daemon-reload
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
    force: true
  when:
    - ansible_facts.service_mgr | lower == "systemd"

- name: reload bind
  become: true
  ansible.builtin.service:
    name: "{{ bind_service }}"
    state: reloaded

# A changed rndc key or controls statement cannot be picked up by a reload:
# on systemd the reload itself runs via rndc, which would fail against the
# still-running named that holds the old key. Restart so named loads it fresh.
- name: restart bind
  become: true
  ansible.builtin.service:
    name: "{{ bind_service }}"
    state: restarted

...
