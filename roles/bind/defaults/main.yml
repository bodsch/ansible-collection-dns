---

# List of zones for which this name server is authoritative
bind_zones: []

# List of acls.
bind_acls: []

# Key binding for secondary servers.
# When set, the keys are written to bind_auth_file (auth_transfer.conf) and
# automatically included into named.conf.
bind_dns_keys: []
#  - name: primary_key
#    algorithm: hmac-sha256
#    secret: "azertyAZERTY123456"

# Key binding for DDNS updates.
# When set, the keys are written to bind_auth_update_file (auth_update.conf)
# and automatically included into named.conf.
bind_update_keys: []
#  - name: update_key
#    algorithm: hmac-sha256
#    secret: "azertyAZERTY123456"

# rndc remote control channel.
# Required so that tools like the bodsch.dns.bind_records role can talk to
# named via 'rndc' (e.g. 'rndc status' / 'rndc reload').
bind_rndc:
  enable: true
  key:
    name: "rndc-key"
    algorithm: "hmac-sha256"
    # If left empty a key is generated automatically with 'rndc-confgen'.
    # For reproducible deployments set a (vault-protected) secret here.
    secret: ""
  controls:
    listen_on: "127.0.0.1"
    port: 953
    allow:
      - "127.0.0.1"
      - "::1"

# List of IPv4 address of the network interface(s) to listen on. Set to "any"
# to listen on all interfaces
bind_listen:
  ipv4:
    - port: 53
      addresses:
        - "127.0.0.1"
  ipv6:
    - port: 53
      addresses:
        - "::1"

# List of hosts that are allowed to query this DNS server.
bind_allow_query:
  - "localhost"

# A key-value list mapping server-IPs to TSIG keys for signing requests
bind_key_mapping: {}

# Determines whether recursion should be allowed. Typically, an authoritative
# name server should have recursion turned OFF.
bind_recursion: false
bind_allow_recursion:
  - "any"

# Allows BIND to be set up as a caching name server
bind_forward_only: false

# List of name servers to forward DNS requests to.
bind_forwarders: []

# DNS round robin order (random or cyclic)
bind_rrset_order: "random"

# statistics channels configuration
bind_statistics:
  channels: false
  port: 8053
  host: 127.0.0.1
  allow:
    - "127.0.0.1"

# DNSSEC configuration
# NOTE In version 9.16.0 the dnssec-enable option was made obsolete and in 9.18.0 the option was entirely removed.
bind_dnssec:
  enable: true
  # dnssec-validation ( yes | no | auto );
  validation: auto

bind_extra_include_files: []

# SOA information
bind_zone_soa:
  ttl: "1W"
  time_to_refresh: "1D"
  time_to_retry: "1H"
  time_to_expire: "1W"
  minimum_ttl: "1D"

bind_logging:
  enable: true
  channels:
    - channel: general
      file: "data/general.log"
      versions: 3
      size: 10M
      print_time: true           # true | false
      print_category: true
      print_severity: true
      severity: dynamic          # critical | error | warning | notice | info | debug [level] | dynamic

# File mode for primary zone files (needs to be something like 0660 for dynamic updates)
bind_zone_file_mode: "0640"

# DNS64 support
bind_dns64: false
bind_dns64_clients:
  - "any"

...
