---

pdns_recursor_incoming:
  allow_from:
    - 127.0.0.0/8
    - 172.17.0.1/16
    - 192.168.100.1/24
    - 192.168.122.1/24
  listen:
    - 127.0.0.1
    - "{{ ansible_facts.default_ipv4.address }}"
    # - 172.17.0.1
    # - 172.22.1.1

pdns_recursor_recursor:
  forward_zones:
    - zone: matrix.lan
      forwarders:
        - 192.168.0.4
        - 192.168.0.1:5300
    - zone: google.de
      forwarders:
        - 127.0.0.1
    - zone: google.com
      forwarders:
        - 127.0.0.1

...
